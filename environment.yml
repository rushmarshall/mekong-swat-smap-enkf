# Conda environment for the SWAT-SMAP EnKF data-assimilation framework.
#
#   conda env create -f environment.yml
#   conda activate mekong-da
#   pip install -e .
#
# gfortran is included so the SWAT-DA model builds without a separate system install.
# On macOS, `brew install gcc` also works and is what the reference build used.
name: mekong-da
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - pytest>=7.4
  - pip
  # Optional: the diagnostic analyses under analyses/.
  - joblib>=1.3
  - statsmodels>=0.14
  # Optional: only needed to rebuild basin-mean SMAP series from raw NetCDF archives.
  - xarray>=2023.1
  - netCDF4>=1.6
  - dask>=2023.1
  # Optional: only needed to compile the Fortran model.
  - gfortran
  - pip:
      - -e .
